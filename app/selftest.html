<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>作业哨兵 · 界面自测</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #F5F6FB; color: #14162B; margin: 0; padding: 28px 20px; }
  .box { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 18px;
         padding: 22px; box-shadow: 0 6px 18px rgba(20,22,43,.07); }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p  { font-size: 13px; color: #5A5F7D; margin: 0 0 18px; line-height: 1.6; }
  a  { display: inline-block; margin: 0 10px 10px 0; padding: 10px 16px;
       background: #4F46E5; color: #fff; text-decoration: none;
       border-radius: 12px; font-size: 14px; font-weight: 600; }
  a.ghost { background: #F1F3FB; color: #5A5F7D; }
  code { background: #F1F3FB; padding: 1px 6px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
<div class="box">
  <h1>作业哨兵 · 界面自测</h1>
  <p>
    这个页面只在电脑上用于检查排版和交互：它会写入一份示例数据，然后跳转到
    <code>index.html</code>。手机上正常使用时不需要它。
  </p>
  <div id="links"></div>
</div>

<script>
// 演示数据：覆盖「紧急 / 接近 / 充裕 / 已逾期 / 已完成」五种状态
const now = Date.now();
const H = 3600e3, D = 24 * H;

const homework = [
  { id: 'demo1', title: '第五章 定积分 课后习题 1-20 题', course: '高等数学',
    due: now + 5 * H, note: '写在作业本上，拍照上传到学习通', done: false, createdAt: now },
  { id: 'demo2', title: '实验报告：霍尔效应测量', course: '大学物理',
    due: now + 30 * H, note: '需要包含误差分析和数据处理过程', done: false, createdAt: now },
  { id: 'demo3', title: '读书笔记《乡土中国》第 3 章', course: '社会学概论',
    due: now + 3 * D + 4 * H, note: '不少于 800 字', done: false, createdAt: now },
  { id: 'demo4', title: 'Unit 5 听力练习 + 作文', course: '大学英语',
    due: now + 6 * D, note: '', done: false, createdAt: now },
  { id: 'demo5', title: '课程设计选题申请表', course: '数据结构',
    due: now - 6 * H, note: '已错过截止时间，尽快联系老师补交', done: false, createdAt: now },
  { id: 'demo6', title: '第一章 绪论 思考题', course: '马克思主义基本原理',
    due: now - 2 * D, note: '', done: true, createdAt: now, doneAt: now - D }
];

localStorage.setItem('hw_sentinel_v1', JSON.stringify({
  v: 1,
  user: { name: '小同', hash: 'demo', createdAt: now },
  homework: homework,
  settings: {
    offsets: ['d3', 'd1', 'h2'],
    dailyDigest: true,
    digestTime: '07:30',
    quietHours: true,
    quietFrom: '23:00',
    quietTo: '07:00'
  }
}));

const views = [
  ['首页', 'home'],
  ['全部作业', 'all'],
  ['提醒设置', 'remind'],
  ['我的', 'me'],
  ['登录页', 'auth']
];

const wrap = document.getElementById('links');
views.forEach(([label, v]) => {
  const a = document.createElement('a');
  a.textContent = label;
  a.href = v === 'auth' ? 'index.html?view=auth' : 'index.html?view=' + v;
  if (v === 'auth') a.className = 'ghost';
  wrap.appendChild(a);
});
</script>
</body>
</html>
