<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>布局诊断</title>
<link rel="stylesheet" href="styles.css" />
<style>body { margin: 0; }</style>
</head>
<body>

<section class="screen screen--auth" id="screen-auth" data-screen="auth">
  <div class="auth-bg" aria-hidden="true"><span class="blob blob--1"></span></div>
  <div class="auth-inner">
    <header class="brand">
      <div class="brand__logo"></div>
      <h1 class="brand__name">作业哨兵</h1>
      <p class="brand__slogan">把快要截止的作业，提前喊你一声</p>
    </header>
    <form class="card auth-card" id="form-login">
      <h2 class="card__title">登录</h2>
      <p class="card__hint">本机账号：首次使用请直接设置一个你自己的密码，数据只保存在手机上。</p>
      <label class="field">
        <span class="field__label">学号 / 手机号</span>
        <span class="field__wrap">
          <input id="input-user" type="text" placeholder="例如 20231001234" />
        </span>
      </label>
      <label class="field">
        <span class="field__label">密码</span>
        <span class="field__wrap">
          <input id="input-pass" type="password" placeholder="至少 6 位" />
        </span>
      </label>
      <p class="form-error" id="login-error" hidden></p>
      <button type="submit" class="btn btn--primary btn--block">进入作业哨兵</button>
      <p class="auth-note"><span>本应用不连接学习通服务器，不会索取你的学习通密码。作业数据支持手动录入，或按 README 接入学校官方接口。</span></p>
    </form>
  </div>
</section>

<script>
// 找出所有比视口宽的元素，直接给出证据
window.addEventListener('load', function () {
  var vw = document.documentElement.clientWidth;
  var rows = ['viewport=' + vw +
              '  body.scrollWidth=' + document.body.scrollWidth +
              '  html.scrollWidth=' + document.documentElement.scrollWidth];

  document.querySelectorAll('*').forEach(function (el) {
    var r = el.getBoundingClientRect();
    if (r.right > vw + 0.5 || r.width > vw + 0.5) {
      rows.push(
        el.tagName.toLowerCase() +
        (el.id ? '#' + el.id : '') +
        (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).join('.') : '') +
        '  left=' + r.left.toFixed(1) + ' right=' + r.right.toFixed(1) +
        ' w=' + r.width.toFixed(1) + ' scrollW=' + el.scrollWidth
      );
    }
  });

  var pre = document.createElement('pre');
  pre.id = 'diag';
  pre.style.cssText = 'position:fixed;left:0;top:0;z-index:9999;background:#fff;font:11px monospace;' +
                      'padding:6px;margin:0;white-space:pre-wrap;max-width:100vw;color:#000;';
  pre.textContent = rows.join('\n');
  document.body.appendChild(pre);
});
</script>
</body>
</html>
